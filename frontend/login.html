<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Cyber Awareness</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        <span class="logo-icon">🛡️</span>
        <span>Cyber Awareness</span>
    </a>

    <nav class="nav-links">
        <nav class="nav-links">

    <a href="index.html">Home</a>

    <a href="learn.html">Learn</a>

    <a href="help.html">Help</a>

    <a href="report.html" class="report-btn">
        Report Incident
    </a>

    <a href="login.html" class="login-btn" id="authNavButton">
        Login
    </a>

</nav>
    </nav>

</header>


<main>

<section class="auth-section">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-switch">

                <button
                    type="button"
                    id="loginTab"
                    class="auth-tab active">
                    Login
                </button>

                <button
                    type="button"
                    id="registerTab"
                    class="auth-tab">
                    Register
                </button>

            </div>


            <!-- LOGIN FORM -->

            <div id="loginPanel">

                <h1>Welcome Back</h1>

                <p class="auth-intro">
                    Login to access your Cyber Awareness account.
                </p>

                <form id="loginForm">

                    <div class="auth-form-group">

                        <label for="loginEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <div class="auth-form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="auth-submit">
                        Login
                    </button>

                </form>

                <div
                    id="loginMessage"
                    class="auth-message">
                </div>

            </div>


            <!-- REGISTER FORM -->

            <div
                id="registerPanel"
                class="hidden">

                <h1>Create Account</h1>

                <p class="auth-intro">
                    Create your Cyber Awareness student account.
                </p>

                <form id="registerForm">

                    <div class="auth-form-group">

                        <label for="registerName">
                            Name
                        </label>

                        <input
                            type="text"
                            id="registerName"
                            name="name"
                            maxlength="100"
                            placeholder="Enter your name"
                            required>

                    </div>


                    <div class="auth-form-group">

                        <label for="registerEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            name="email"
                            maxlength="150"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <div class="auth-form-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="registerPassword"
                            name="password"
                            minlength="8"
                            placeholder="At least 8 characters"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="auth-submit">
                        Create Account
                    </button>

                </form>

                <div
                    id="registerMessage"
                    class="auth-message">
                </div>

            </div>

        </div>

    </div>

</section>

</main>


<footer class="footer">

    <p>
        © 2026 Cyber Awareness. Stay Safe. Stay Aware.
    </p>

</footer>


<script src="script.js"></script>

</body>
</html>
